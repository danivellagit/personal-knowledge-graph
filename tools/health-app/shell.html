<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="__APP_NAME__">
<meta name="application-name" content="__APP_NAME__">
<meta name="theme-color" content="__THEME__">
<meta name="color-scheme" content="dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<title>__APP_NAME__</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
html,body{margin:0;padding:0;height:100%;background:__THEME__;color:#fff;color-scheme:dark;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
/* ---- iOS standalone geometry: the contract with the page ----
   An installed iOS app with a black-translucent status bar under-reports innerHeight / 100dvh by
   the status-bar height, so a page sized from them ends short of the screen bottom. The script
   below measures the real height into --app-h. #root is the full-screen scroll container; the page
   pads its own top and bottom with --sa-t / --sa-b (safe areas: status bar, home indicator). */
:root{--sa-t:env(safe-area-inset-top,0px);--sa-b:env(safe-area-inset-bottom,0px);--app-h:100vh}
html,body{min-height:var(--app-h)}
#root{position:fixed;inset:0 0 auto 0;height:var(--app-h);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#lock{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(24px + var(--sa-t)) 28px calc(24px + var(--sa-b));box-sizing:border-box;background:linear-gradient(180deg,#2A3843 0,#121A20 320px,__THEME__ 100%);z-index:10}
#lock[hidden]{display:none}
#lock .t{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#B5BCC2}
#lock form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
#lock label.f{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#7D868D}
#lock input[type=password]{width:100%;box-sizing:border-box;font-size:17px;padding:14px 16px;border-radius:14px;border:1px solid #2A3239;background:#1A2026;color:#fff;outline:none;-webkit-appearance:none;appearance:none}
#lock input[type=password]:focus{border-color:__ACCENT__}
#lock .r{display:flex;align-items:center;gap:10px;font-size:15px;color:#B5BCC2}
#lock .r input{width:20px;height:20px;accent-color:__ACCENT__}
#lock button{font-size:16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:15px;border:0;border-radius:999px;background:__ACCENT__;color:__ACCENT_INK__;-webkit-appearance:none;appearance:none}
#lock button:disabled{opacity:.6}
#lock .e{min-height:20px;font-size:14px;color:#FF5A6E;text-align:center}
</style>
</head>
<body>
<div id="lock" hidden>
  <svg width="84" height="84" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38" fill="none" stroke="#2C353C" stroke-width="10"/><circle cx="50" cy="50" r="38" fill="none" stroke="__ACCENT__" stroke-width="10" stroke-linecap="round" stroke-dasharray="186 239" transform="rotate(-90 50 50)"/><path d="M50 66C38 57 32 50.5 32 43.5 32 38.5 35.8 35 40.3 35c4 0 6.8 2.3 9.7 6 2.9-3.7 5.7-6 9.7-6 4.5 0 8.3 3.5 8.3 8.5 0 7-6 13.5-18 22.5z" fill="#fff"/></svg>
  <div class="t">__APP_NAME__</div>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="__APP_SLUG__" autocomplete="username" hidden>
    <label class="f" for="pw">__T_PASSWORD__</label>
    <input id="pw" type="password" name="password" autocomplete="current-password" required>
    <label class="r"><input id="rm" type="checkbox" checked> __T_REMEMBER__</label>
    <button id="go" type="submit">__T_UNLOCK__</button>
    <div class="e" id="err" role="alert"></div>
  </form>
</div>
<div id="root"></div>
<script>
var P = __PAYLOAD__;
var T = __STRINGS__;
(function () {
  // KEY holds the derived AES key (never the password) when "remember" is ticked; ?logout forgets it.
  var KEY = T.slug + ".k", TRIED = T.slug + ".tried", S = window.crypto && crypto.subtle;
  var $ = function (id) { return document.getElementById(id); };
  var b2u = function (b) { var s = atob(b), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
  var u2b = function (u) { var s = ""; u = new Uint8Array(u); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function dec(key) { return S.decrypt({ name: "AES-GCM", iv: b2u(P.v) }, key, b2u(P.c)).then(function (b) { return new TextDecoder().decode(b); }); }
  // real full-screen height: iOS standalone under-reports innerHeight by the status-bar height
  function fit() {
    var de = document.documentElement, h = Math.max(window.innerHeight || 0, de.clientHeight || 0);
    var standalone = navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    if (standalone && window.screen) { var portrait = !window.matchMedia || matchMedia("(orientation: portrait)").matches;
      var sh = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width); if (sh > h) h = sh; }
    de.style.setProperty("--app-h", h + "px");
  }
  fit(); window.addEventListener("resize", fit); window.addEventListener("orientationchange", function () { setTimeout(fit, 300); });
  function run(js) {
    $("lock").hidden = true; var s = document.createElement("script"); s.textContent = js; document.body.appendChild(s);
    document.documentElement.setAttribute("data-unlocked", "1"); fit(); watch();
  }
  function showLock(msg) { $("lock").hidden = false; $("err").textContent = msg || ""; }
  function check() {
    fetch("version.txt?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : null; }).then(function (v) {
      v = v && v.trim();
      var tried = null; try { tried = sessionStorage.getItem(TRIED); } catch (e) {}
      if (v && v !== P.b && tried !== v) { try { sessionStorage.setItem(TRIED, v); } catch (e) {} location.replace("./?v=" + encodeURIComponent(v)); }
    }).catch(function () {});
  }
  function watch() {
    // on every launch and whenever the installed app returns to the foreground: reload if a newer build exists
    check();
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") check(); });
    window.addEventListener("pageshow", function (e) { if (e.persisted) check(); });
  }
  // network-first service worker: always refetches index.html with no-store, offline fallback
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function () {});
  document.documentElement.setAttribute("data-build", P.b);
  if (!S) { showLock(T.nocrypto); return; }
  if (/[?&]logout\b/.test(location.search)) store(KEY, null);
  $("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pw = $("pw").value; if (!pw) return;
    $("go").disabled = true; $("err").textContent = "";
    S.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return S.deriveKey({ name: "PBKDF2", salt: b2u(P.s), iterations: P.i, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    }).then(function (key) {
      return dec(key).then(function (js) {
        if ($("rm").checked) return S.exportKey("raw", key).then(function (raw) { store(KEY, u2b(raw)); return js; });
        store(KEY, null); return js;
      });
    }).then(function (js) { $("pw").blur(); run(js); }, function () { $("go").disabled = false; showLock(T.wrong); $("pw").select(); });
  });
  var k = load(KEY);
  if (k) {
    S.importKey("raw", b2u(k), { name: "AES-GCM" }, false, ["decrypt"]).then(dec).then(run, function () { store(KEY, null); showLock(); });
  } else showLock();
})();
</script>
</body>
</html>
