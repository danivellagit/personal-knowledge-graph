# Configure your instance. Copy this file to config.local.yml (gitignored) and edit it.
# Only `owner` and `owner_slug` are needed. With no sources at all the graph still works: you log
# exchanges by hand and build the graph. Add sources to make the daily sweep useful, and switch on
# the optional modules (agents, body, location) only if you want them.
# Paths may start with ~ ; none of them should point inside data/ unless stated.

owner: "Your Name"           # display name: whose stream and relationships these are
owner_slug: "_me"            # the owner node is always data/_me.md (+ data/interactions/_me/); set this to another slug
                             # (e.g. the one other sources use for you) and the tools treat both as the owner
owner_language: "en"         # the language agents talk to the owner in; the repo is always written in English
data_dir: "./data"           # where the graph lives (private, gitignored by default); the tools always read <repo>/data
git_sync: "on"               # the Claude Code hooks pull on start and commit+push on stop; "off" disables (env GIT_SYNC)

# OPTIONAL external sources, read-only, to enrich the work side of a brief.
# Empty is fine: every skill still works. None is required.
sources:
  - name: work-graph
    type: repo-graph
    path: "../your-work-repo"
    read: [people, companies, notes]      # READ ONLY, never written
    scope: work-only                       # nothing personal is imported from here

# OPTIONAL integrations. Wire the ones you have; leave the rest out.
integrations:
  calendar: gcal             # for cadence + routine triggers
  transcripts: fireflies     # source for auto-logging meetings
  mail: gmail                # person-to-person mail only
  whatsapp: whatsapp-mcp     # local bridge (lharries/whatsapp-mcp). See SETUP-WHATSAPP.md

# OPTIONAL: where the message history lives, read-only. tools/owed_backfill.py measures from it
# which days with real traffic still have no log. Env vars override: WHATSAPP_DB, WHATSAPP_DESKTOP_DB.
whatsapp:
  # bridge_db: "~/whatsapp-mcp/whatsapp-bridge/store/messages.db"   # the whatsapp-mcp bridge's store
  # desktop_db: ""            # opt-in second source: the WhatsApp desktop app's own ChatStorage.sqlite,
  #                           # which can reach further back than the bridge (never read unless set)

backfill:
  busy_min: 50                # messages/day below which a day is noise, not a lost day (env BACKFILL_BUSY_MIN)
  # until: "YYYY-MM-DD"       # exclusive end of the measured region; default today (env BACKFILL_UNTIL)

# OPTIONAL Notion reconciliation (the notion-sync skill and the optional mirrors).
# Delete this block if you do not use Notion.
notion:
  people_datasource: "collection://<your People data-source id>"
  companies_datasource: "collection://<your Companies data-source id>"
  # body_daily_datasource: "collection://<id>"   # body layer: one row per day (tools/body.py notion)
  # labs_datasource: "collection://<id>"         # body layer: lab reports with the PDF attached

# Flow C: daily sweep behaviour
sweep:
  create_nodes: on-recurrence   # on-recurrence (default, disciplined) | always (a person node for every human)
  window_hours: 24
  whatsapp:
    include_groups: true            # groups are read: messages attributed to the sender feed existing person nodes; a group never becomes a person node
    unknown_number_min_days: 2      # a number with no saved name becomes a node only after 2+ distinct days of exchange
    skip: [business, broadcast, otp, automated]   # person-to-person only

# The wall, as data: tools/rebuild_followups.py keeps these out of the work digest (data/_followups/).
# Built in: the owner, any node with `wall: personal` in its frontmatter, and people whose
# `relationship:` is a personal bond; follow-ups mentioning health, money, legal, dating, family...
wall:
  bonds: [family, partner, ex, dating]   # personal bonds: people tied to you this way never reach the digest
  exclude_slugs: []             # more people whose exchanges are never work: friends, a therapist, a teacher...
  sensitive_words: []           # extra words that drop a single follow-up from the digest

# Instance vocabulary for tools/checks.py (all optional; lists or "a, b" strings).
checks:
  qualifier_words: []           # words that disambiguate rather than name ("Theo Gym"): your team, your club
  kin_slugs: []                 # person slugs that are kin by role ("mom"): never asked for a surname
  nicknames: []                 # "short=long" pairs for the duplicate detector, e.g. ["liz=elizabeth", "theo=theodore"]
  common_tokens: []             # alias tokens too common to mean anything (your company's domain)
  stop_words: []                # capitalised words that are never a venue ("Monday", your own name)

# ---------------------------------------------------------------------------------------------
# OPTIONAL MODULES. Each is off unless `enabled: true`. See anatomy.md, "Optional modules".
# ---------------------------------------------------------------------------------------------

agents:
  enabled: false
  # Persona names are generated by `python3 tools/agents/create_agent.py <role>` (it fills `persona:`
  # in agents/<role>/AGENT.md). To choose a name yourself, set it here or pass --name.
  # persona_city: ""            # the personas' city; default "the owner's city"
  # personas:
  #   fitness-coach: ""
  #   psychologist: ""
  #   founder-assistant: ""
  #   linkedin-coach: ""
  #   web-builder: ""
  #   brand-designer: ""
  #   accountant: ""
  #   health-advisor: ""
  #   best-friend: ""
  #   tech-maintainer: ""
  #   english-teacher: ""
  #   recruiter: ""
  #   legal: ""

# The body layer: a wearable read through its vendor's CLI / API (tools/body-pull.sh, body.py,
# calories.py, food.py). Raw data and the store stay OFF-repo. Uncomment what you use; an unset
# path means "not configured" and the tools say so instead of failing.
body:
  enabled: false
  # raw_dir: "~/health/wearable/raw"    # where body-pull.sh writes raw JSON, one file per type per day; env BODY_RAW
  # db: "~/health/health.db"            # SQLite store rebuilt by `tools/body.py ingest`; env BODY_DB
  # first_day: "2030-01-01"             # first day to write / pull (default: the first day in the store); env BODY_FIRST_DAY
  # sources: "My Watch, VENDOR"         # device source names to keep (default all): two devices on one
  #                                     # account are different sensors, never mix them; env BODY_SOURCES
  # device: "wearable"                  # a label for the text, e.g. "smartwatch"; env BODY_DEVICE
  # sport_words: []                     # extra words that make a message "about a session"; env BODY_SPORT_WORDS
  # cli: "~/bin/ghealth"                # the wearable CLI binary (reference setup: a Google Health API client
  #                                     # for Fitbit / Pixel Watch data); env GHEALTH
  # height_cm: 175                      # used by tools/calories.py (overridable with --height-cm); env BODY_HEIGHT_CM
  # sex: "male"                         # male | female, picks the BMR formula in tools/calories.py; env BODY_SEX
  # labs_pdf_dir: "~/health/labs"       # lab report PDFs, off-repo

# The location layer: Overland (iOS) -> a receiver you host -> tools/location-pull.sh ->
# tools/location.py. Raw coordinates stay OFF-repo.
location:
  enabled: false
  # raw_dir: "~/health/location"        # overland/<date>/ batches + timeline/ (Google Maps Timeline export)
  # db: "~/health/location/location.db" # SQLite store rebuilt by `tools/location.py ingest`
  # pull_command: "node ~/location-receiver/pull.mjs"   # how location-pull.sh fetches new batches from YOUR store
  # prune_after_days: 7                 # delete batches from the remote store once pulled and older than this

# The Life App: an installable, password-locked phone app with one number (Life Health) over seven life areas,
# fed by data/happiness/*.json (one file per agent). Source: tools/life-app/ (README there). First run:
#   bash tools/life-app/setup.sh              (sample data, password, first build; --create-site makes your Pages repo)
# Then every update: bash tools/life-app/publish.sh. Every key is optional; LIFE_APP_* env vars win where noted.
life_app:
  enabled: true
  # owner_name: ""                      # shown in the app (initial in the header); default: `owner` above; env LIFE_APP_OWNER
  # owner_words: [me, I]               # words in the "Who" (or "Chi") column of data/finance/scadenzario.md that mean you (+ your first name)
  # app_name: "Life"                    # home-screen / lock-screen name; env LIFE_APP_NAME
  # login_username: "life-app"          # hidden username next to the password (what a password manager saves it under)
  # description: "Life Health: every area of your life"
  # lang: "en"                          # the page language tag (the app's wording is English)
  # timezone: "Europe/Rome"             # "today" in the app; env LIFE_APP_TZ
  # labels:
  #   gym: "Gym"                        # label of the gym row in Body (e.g. "Gym / <your gym>")
  # password_file: "~/.secrets/life-app-password"   # one line, OUTSIDE the repo, never committed; env LIFE_APP_PASSWORD_FILE
  # cache_dir: "~/.cache/life-app"      # off-repo: salt, deploy dir, last published hash; env LIFE_APP_CACHE
  # salt_file: ""                       # default <cache_dir>/salt.txt, made on the first build (keep it: a new salt = re-login)
  # avatar: ""                          # a small JPEG/PNG outside the repo, embedded only inside the ciphertext
  # health_page: ""                     # default tools/life-app/src/health/health-page.tsx; env LIFE_APP_HEALTH_PAGE
  # hooks:
  #   hair_photos: ""                   # ES module exporting writeHairInit(workDir) -> count (photos for Health > Photos,
  #                                     # embedded only in the ciphertext); none = the view shows placeholders
  # (relative paths in this block are taken from the repo root. A private instance that commits everything may keep
  #  this same `life_app:` block in a committed tools/life-app/instance.yml instead; config.local.yml wins over it.)
  # site:                               # your SEPARATE public GitHub Pages repo; it only ever receives ciphertext
  #   repo: "your-github-user/life-app" # env LIFE_APP_REPO; setup.sh --create-site fills it in
  #   branch: "main"
  #   url: ""                           # default https://<user>.github.io/<repo>/
  #   token_file: ""                    # a token that can push there (default: gh / git credentials)
  #   git_name: "life-app"              # author of the deploy commit (keep it neutral)
  #   git_email: "life-app@users.noreply.github.com"
  # writeback:                          # taps in the app -> a PRIVATE event repo (README "Write-back"); off by default
  #   enabled: false
  #   repo: "your-github-user/life-log"
  #   branch: "main"
  #   token_file: "~/.secrets/life-log-token"   # fine-grained token, Contents read/write on that repo ONLY
  # areas:                              # ids are fixed; name, agents (role or persona names), weight in the total
  #   lavoro:
  #     name: "Work"
  #     agents: "founder-assistant, linkedin-coach"
  #     weight: 1                       # 0 = shown but not counted in Life Health
  #   vita:
  #     enabled: true                   # only relazioni, crescita, vita can be switched off
